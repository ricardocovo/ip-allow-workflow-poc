name: IP Allow List Update

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional Service Tags publication date (YYYYMMDD)
        required: false
        type: string
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  AUTOMATION_BRANCH_PREFIX: automation/ip-allow-list-update-
  AUTOMATION_BRANCH: automation/ip-allow-list-update-${{ github.ref_name }}
  AUTOMATION_PR_TITLE: Update Power BI Canada Central IP allow list
  LEGACY_AUTOMATION_BRANCH: automation/ip-allow-list-update
  TARGET_BRANCH: ${{ github.ref_name }}

concurrency:
  group: ip-allow-list-update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.download.outputs.available }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Log workflow context
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "::notice title=Workflow context::event=${EVENT_NAME}, run=${RUN_NUMBER}, attempt=${RUN_ATTEMPT}"
          echo "::notice title=Branch context::target=${TARGET_BRANCH}, automation=${AUTOMATION_BRANCH}"

      - name: Resolve Service Tags URL
        id: source
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_date="$REQUESTED_DATE"
          if [[ -z "$source_date" ]]; then
            source_date="$(date -u +%Y%m%d)"
          elif [[ ! "$source_date" =~ ^[0-9]{8}$ ]]; then
            echo "The date input must use YYYYMMDD format." >&2
            exit 1
          else
            normalized_date="$(
              date -u -d "${source_date:0:4}-${source_date:4:2}-${source_date:6:2}" +%Y%m%d 2>/dev/null
            )" || {
              echo "The date input must be a valid calendar date." >&2
              exit 1
            }
            if [[ "$normalized_date" != "$source_date" ]]; then
              echo "The date input must be a valid calendar date." >&2
              exit 1
            fi
          fi

          base_url="https://download.microsoft.com/download/7/1/d/71d86715-5596-4529-9b13-da13a5de5b63"
          download_url="${base_url}/ServiceTags_Public_${source_date}.json"
          echo "source_date=$source_date" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Service Tags source::date=${source_date}, url=${download_url}"

      - name: Download Service Tags
        id: download
        run: >-
          python scripts/ip_allow_list.py download
          --download-url "${{ steps.source.outputs.download_url }}"
          --download-dir "${{ runner.temp }}/service-tags"
          --github-output "$GITHUB_OUTPUT"

      - name: Log download result
        env:
          AVAILABLE: ${{ steps.download.outputs.available }}
          DOWNLOAD_PATH: ${{ steps.download.outputs.download_path }}
        run: |
          if [[ "$AVAILABLE" == "true" ]]; then
            echo "::notice title=Download complete::Service Tags saved to ${DOWNLOAD_PATH}"
          else
            echo "::notice title=No publication::The requested Service Tags file is not available; downstream jobs will be skipped"
          fi

      - name: Set artifact name
        if: steps.download.outputs.available == 'true'
        id: artifact
        env:
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
        run: echo "name=azure-service-tags-${SOURCE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Upload Service Tags artifact
        if: steps.download.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.download.outputs.download_path }}
          if-no-files-found: error
          retention-days: 30

  reconcile-prs:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.automation-pr.outputs.branch }}
      pull-request-number: ${{ steps.automation-pr.outputs.pull-request-number }}
    steps:
      - name: Resolve active automation pull request
        id: automation-pr
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.IP_ALLOW_LIST_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          matching_prs="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --state open \
              --limit 1000 \
              --json number,headRefName,createdAt,isCrossRepository |
              jq \
                --arg legacy_branch "$LEGACY_AUTOMATION_BRANCH" \
                --arg prefix "$AUTOMATION_BRANCH_PREFIX" \
                '[
                  .[]
                  | select(
                      .isCrossRepository == false
                      and (
                        .headRefName == $legacy_branch
                        or (.headRefName | startswith($prefix))
                      )
                    )
                ] | sort_by(.createdAt) | reverse'
          )"
          pr_count="$(jq 'length' <<< "$matching_prs")"
          active_branch="$AUTOMATION_BRANCH"
          active_pr_number=""

          if [[ "$pr_count" -gt 0 ]]; then
            active_branch="$(jq -r '.[0].headRefName' <<< "$matching_prs")"
            active_pr_number="$(jq -r '.[0].number' <<< "$matching_prs")"
          fi

          echo "::notice title=PR lookup::found=${pr_count}, active_pr=${active_pr_number:-none}, active_branch=${active_branch}, base=${TARGET_BRANCH}"

          while IFS=$'\t' read -r duplicate_number duplicate_branch; do
            [[ -n "$duplicate_number" ]] || continue
            echo "::warning title=Closing duplicate PR::PR #${duplicate_number} from ${duplicate_branch} is superseded by #${active_pr_number}"
            gh pr close "$duplicate_number" \
              --delete-branch \
              --comment "Closed automatically because #${active_pr_number} is the newest IP allow-list automation PR for \`${TARGET_BRANCH}\`."
          done < <(jq -r '.[1:][] | [.number, .headRefName] | @tsv' <<< "$matching_prs")

          echo "branch=$active_branch" >> "$GITHUB_OUTPUT"
          echo "pull-request-number=$active_pr_number" >> "$GITHUB_OUTPUT"

  process:
    needs:
      - download
      - reconcile-prs
    if: needs.download.outputs.available == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.process.outputs.changed }}
      pull-request-number: ${{ steps.pull-request.outputs.pull-request-number }}
      pull-request-operation: ${{ steps.pull-request.outputs.pull-request-operation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Log processing context
        env:
          ACTIVE_AUTOMATION_BRANCH: ${{ needs.reconcile-prs.outputs.branch }}
          ARTIFACT_NAME: ${{ needs.download.outputs.artifact-name }}
        run: |
          echo "::notice title=Processing context::artifact=${ARTIFACT_NAME}, target=${TARGET_BRANCH}, automation=${ACTIVE_AUTOMATION_BRANCH}"

      - name: Download Service Tags artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.download.outputs.artifact-name }}
          path: ${{ runner.temp }}/service-tags

      - name: Locate Service Tags file
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t source_files < <(find "${RUNNER_TEMP}/service-tags" -type f)
          if [[ "${#source_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one Service Tags file; found ${#source_files[@]}" >&2
            exit 1
          fi
          echo "path=${source_files[0]}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Source located::${source_files[0]}"

      - name: Select processing baseline
        env:
          ACTIVE_AUTOMATION_BRANCH: ${{ needs.reconcile-prs.outputs.branch }}
          ACTIVE_PR_NUMBER: ${{ needs.reconcile-prs.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail
          cp data/powerbi-canadacentral-prefixes.json \
            "${RUNNER_TEMP}/main-powerbi-canadacentral-prefixes.json"
          if [[ -n "$ACTIVE_PR_NUMBER" ]]; then
            git fetch --no-tags origin "$ACTIVE_AUTOMATION_BRANCH"
            git show FETCH_HEAD:data/powerbi-canadacentral-prefixes.json > snapshot.tmp
            mv snapshot.tmp data/powerbi-canadacentral-prefixes.json
            echo "::notice title=Baseline selected::Using the snapshot from ${ACTIVE_AUTOMATION_BRANCH} (PR #${ACTIVE_PR_NUMBER})"
          else
            echo "::notice title=Baseline selected::Using the snapshot from ${TARGET_BRANCH}"
          fi

      - name: Build IP allow-list actions
        id: process
        run: >-
          python scripts/ip_allow_list.py process
          --source "${{ steps.source.outputs.path }}"
          --snapshot data/powerbi-canadacentral-prefixes.json
          --action-baseline "${{ runner.temp }}/main-powerbi-canadacentral-prefixes.json"
          --actions ip-manage-actions.json
          --summary "${{ runner.temp }}/ip-change-summary.md"
          --github-output "$GITHUB_OUTPUT"

      - name: Log processing result
        env:
          ADDED_COUNT: ${{ steps.process.outputs.added_count }}
          CHANGED: ${{ steps.process.outputs.changed }}
          HAS_DELTA: ${{ steps.process.outputs.has_delta }}
          REMOVED_COUNT: ${{ steps.process.outputs.removed_count }}
          SUMMARY_PATH: ${{ steps.process.outputs.summary_path }}
        run: |
          echo "::notice title=Allow-list comparison::changed=${CHANGED}, has_delta=${HAS_DELTA}, added=${ADDED_COUNT}, removed=${REMOVED_COUNT}"
          {
            echo "## IP allow-list update"
            echo
            echo "| Target branch | New change | Has delta | Added | Removed |"
            echo "| --- | --- | --- | ---: | ---: |"
            echo "| \`${TARGET_BRANCH}\` | ${CHANGED} | ${HAS_DELTA} | ${ADDED_COUNT} | ${REMOVED_COUNT} |"
            if [[ -f "$SUMMARY_PATH" ]]; then
              echo
              cat "$SUMMARY_PATH"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.IP_ALLOW_LIST_PR_TOKEN || github.token }}
          branch: ${{ needs.reconcile-prs.outputs.branch }}
          base: ${{ env.TARGET_BRANCH }}
          delete-branch: true
          commit-message: Update Power BI Canada Central IP allow list
          title: ${{ env.AUTOMATION_PR_TITLE }}
          body: |
            Automated update from the latest Azure Public Service Tags publication.

            The detailed CIDR additions and removals are included in a PR comment.
          add-paths: |
            data/powerbi-canadacentral-prefixes.json
            ip-manage-actions.json

      - name: Log pull request result
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          case "$PR_OPERATION" in
            created|updated)
              echo "::notice title=Pull request ${PR_OPERATION}::number=${PR_NUMBER}, url=${PR_URL}"
              ;;
            closed)
              echo "::notice title=Pull request closed::The latest publication has no net change for ${TARGET_BRANCH}"
              ;;
            *)
              echo "::notice title=Pull request unchanged::The active proposal already reflects the latest publication"
              ;;
          esac

      - name: Comment with IP address changes
        if: >-
          steps.process.outputs.changed == 'true' &&
          (
            steps.pull-request.outputs.pull-request-operation == 'created' ||
            steps.pull-request.outputs.pull-request-operation == 'updated'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          SUMMARY_PATH: ${{ steps.process.outputs.summary_path }}
        run: |
          echo "::notice title=PR comment::Posting the CIDR summary to PR #${PR_NUMBER}"
          gh pr comment "$PR_NUMBER" --body-file "$SUMMARY_PATH"

      - name: Upload IP management actions
        if: >-
          steps.process.outputs.changed == 'true' &&
          (
            steps.pull-request.outputs.pull-request-operation == 'created' ||
            steps.pull-request.outputs.pull-request-operation == 'updated'
          )
        uses: actions/upload-artifact@v4
        with:
          name: ip-manage-actions
          path: ip-manage-actions.json
          if-no-files-found: error
          retention-days: 30

  call-api:
    needs: process
    if: >-
      needs.process.outputs.changed == 'true' &&
      (
        needs.process.outputs.pull-request-operation == 'created' ||
        needs.process.outputs.pull-request-operation == 'updated'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download IP management actions
        uses: actions/download-artifact@v5
        with:
          name: ip-manage-actions
          path: ${{ runner.temp }}/ip-manage-actions

      - name: Create SNOW Entry
        env:
          ACTIONS_PATH: ${{ runner.temp }}/ip-manage-actions/ip-manage-actions.json
          PR_NUMBER: ${{ needs.process.outputs.pull-request-number }}
        run: |
          echo "::notice title=SNOW request::Creating an entry from PR #${PR_NUMBER} using ${ACTIONS_PATH}"
          python scripts/ip_allow_list.py create-snow-entry --actions "$ACTIONS_PATH"
          echo "::notice title=SNOW result::Mock entry created successfully"
